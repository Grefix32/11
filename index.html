<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обчислювальна мережа мережі аптек – Supabase</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <main class="container">
    <h1>Мережа аптек: облік вузлів</h1>
    <p id="status" role="status" aria-live="polite"></p>
    <section aria-labelledby="nodes-heading">
      <h2 id="nodes-heading">Список мережевих вузлів</h2>
      <ul id="nodes-list"></ul>
    </section>
    <section aria-labelledby="form-heading">
      <h2 id="form-heading">Додати вузол мережі</h2>
      <form id="node-form">
        <label for="pharmacy-name">Назва аптеки (філія)</label>
        <input id="pharmacy-name" name="pharmacy_name" required maxlength="150">
        <label for="ip-address">IP-адреса / підмережа</label>
        <input id="ip-address" name="ip_address" required maxlength="150">
        <button type="submit">Додати</button>
      </form>
    </section>
  </main>
</body>
</html>
